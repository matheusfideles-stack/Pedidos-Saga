# Entrada unica do compose (porta 8080):
#   /            -> interface web (HTML/CSS/JS estatico, pasta web/)
#   /orders,/catalog -> order-service      /inventory -> inventory-service      /payments -> payment-service
# 'resolver' + variavel forcam o nginx a re-resolver o DNS (replicas que sobem/descem depois do start).
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;

    # Requisicoes de API: o caminho chega ao servico sem alteracao (sem 'rewrite').
    location /orders {
        set $upstream http://order-service:8080;
        include /etc/nginx/conf.d/proxy-params.inc;
    }

    location /catalog {
        set $upstream http://order-service:8080;
        include /etc/nginx/conf.d/proxy-params.inc;
    }

    location /inventory {
        set $upstream http://inventory-service:8080;
        include /etc/nginx/conf.d/proxy-params.inc;
    }

    location /payments {
        set $upstream http://payment-service:8080;
        include /etc/nginx/conf.d/proxy-params.inc;
    }

    # Interface web (arquivos estaticos). A navegacao usa hash (#/pedidos), entao nao ha rota de servidor a emular:
    # arquivo inexistente responde 404 de verdade, em vez de devolver o index.html e esconder o erro.
    # 'no-cache' obriga o navegador a revalidar (ETag): uma nova versao do JS/CSS aparece sem precisar limpar o cache.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Foto de fundo OPCIONAL (web/fundo.webp): se nao existir, responde 204 em vez de 404 e a interface usa o gradiente.
    location = /fundo.webp {
        root /usr/share/nginx/html;
        try_files $uri =204;
        add_header Cache-Control "no-cache";
    }
}
