# Balanceador de entrada do compose: distribui entre as replicas do order-service.
# 'resolver' + variavel forcam o nginx a re-resolver o DNS (replicas que sobem/descem depois do start).
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;

    location / {
        set $upstream http://order-service:8080;
        proxy_pass $upstream;
        proxy_connect_timeout 1s;
        proxy_read_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Idempotency-Key $http_idempotency_key;
    }
}
