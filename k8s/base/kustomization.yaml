apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pedidos-saga
resources:
  - 00-namespace.yaml
  - 10-postgres.yaml
  - 20-kafka-redis.yaml
  - 30-kafka-connect.yaml
  - 40-services.yaml
  - 50-analytics-worker.yaml

# Fonte unica da configuracao do Debezium: os mesmos JSON do docker-compose.
# Requer --load-restrictor LoadRestrictionsNone (arquivos fora da pasta do kustomization):
#   kubectl kustomize --load-restrictor=LoadRestrictionsNone k8s/base | kubectl apply -f -
configMapGenerator:
  - name: debezium-connectors
    namespace: pedidos-saga
    files:
      - ../../infra/debezium/order-outbox.json
      - ../../infra/debezium/inventory-outbox.json
      - ../../infra/debezium/payment-outbox.json
generatorOptions:
  disableNameSuffixHash: true
