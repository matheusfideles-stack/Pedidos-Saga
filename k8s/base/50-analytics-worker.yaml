apiVersion: apps/v1
kind: Deployment
metadata: { name: analytics-worker, namespace: pedidos-saga }
spec:
  replicas: 2   # mesmo consumer group: as particoes de order.events se dividem entre as replicas
  selector: { matchLabels: { app: analytics-worker } }
  template:
    metadata:
      labels: { app: analytics-worker, app.kubernetes.io/part-of: pedidos-saga }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9100"
    spec:
      containers:
        - name: analytics-worker
          image: saga/analytics-worker:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 9100, name: metrics }]
          env:
            - { name: KAFKA_BROKERS, value: "kafka:9092" }
            - { name: KAFKA_TOPIC, value: order.events }
            - { name: KAFKA_GROUP, value: analytics-worker }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: db-credentials, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: DB_PASSWORD } }
            - { name: DATABASE_URL, value: "postgres://$(DB_USER):$(DB_PASSWORD)@analytics-db:5432/analytics?sslmode=disable" }
            - { name: METRICS_ADDR, value: ":9100" }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: metrics }
            periodSeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: analytics-worker, namespace: pedidos-saga }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: analytics-worker }
  minReplicas: 2
  maxReplicas: 6      # = numero de particoes de order.events
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
# Entrada para kind/minikube: NodePort 30080 -> order-service (ver k8s/kind-config.yaml, mapeado para localhost:8080)
apiVersion: v1
kind: Service
metadata: { name: order-service-external, namespace: pedidos-saga }
spec:
  type: NodePort
  selector: { app: order-service }
  ports: [{ name: http, port: 8080, targetPort: http, nodePort: 30080 }]
